<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3BD4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kantong">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kantong</title>
<style>
:root {
  /* Layout: satu kolom seperti buku kas. Header bulan, ringkasan, rincian + grafik harian, riwayat; tombol Catat di dasar membuka lembar isian. */
  --bg: #ECEFF4;
  --surface: #FFFFFF;
  --surface-2: #F3F5F9;
  --ink: #131A26;
  --muted: #586277;
  --line: #D8DDE6;
  --accent: #2A3BD4;
  --on-accent: #FFFFFF;
  --good: #13794A;
  --warn: #A45F00;
  --bad: #C0261E;
  --scrim: rgba(10, 14, 22, 0.5);
  --c-makan: #E0522B;
  --c-kos: #2A3BD4;
  --c-transport: #0B93A1;
  --c-kuliah: #7A3EC2;
  --c-pulsa: #B58900;
  --c-belanja: #D13A83;
  --c-hiburan: #2B9A4B;
  --c-lainnya: #6A7587;
  --font-display: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131B; --surface: #171C27; --surface-2: #1E2431; --ink: #E8ECF3; --muted: #98A2B5; --line: #2A3242;
    --accent: #8795FF; --on-accent: #0F131B; --good: #4CC38A; --warn: #E9A64A; --bad: #FF7A72; --scrim: rgba(0, 0, 0, 0.6);
    --c-makan: #FF8A63; --c-kos: #8795FF; --c-transport: #3FC3D1; --c-kuliah: #B88CF2; --c-pulsa: #E3B72E; --c-belanja: #F27AB1; --c-hiburan: #55C97A; --c-lainnya: #9AA5B8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131B; --surface: #171C27; --surface-2: #1E2431; --ink: #E8ECF3; --muted: #98A2B5; --line: #2A3242;
  --accent: #8795FF; --on-accent: #0F131B; --good: #4CC38A; --warn: #E9A64A; --bad: #FF7A72; --scrim: rgba(0, 0, 0, 0.6);
  --c-makan: #FF8A63; --c-kos: #8795FF; --c-transport: #3FC3D1; --c-kuliah: #B88CF2; --c-pulsa: #E3B72E; --c-belanja: #F27AB1; --c-hiburan: #55C97A; --c-lainnya: #9AA5B8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { color-scheme: light; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 16px 104px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0; }
.months { display: flex; align-items: center; gap: 4px; }
.months .label { font-weight: 600; min-width: 8.5em; text-align: center; font-variant-numeric: tabular-nums; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }

/* summary */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; box-shadow: 0 1px 2px rgba(19, 26, 38, 0.05); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.total { font-family: var(--font-display); font-weight: 700; font-size: 42px; line-height: 1.1; letter-spacing: -0.02em; margin: 6px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.total .cur { font-size: 20px; font-weight: 600; color: var(--muted); margin-right: 6px; letter-spacing: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.stat dt { font-size: 12px; color: var(--muted); }
.stat dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.budget { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.budget-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.budget-head strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter > span { display: block; height: 100%; border-radius: 6px; background: var(--good); }
.meter > span.warn { background: var(--warn); }
.meter > span.bad { background: var(--bad); }
.budget-note { font-size: 13px; margin: 0; }
.budget-note.bad { color: var(--bad); }
.link-btn { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; text-align: left; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.inline-form .field { flex: 1 1 160px; min-width: 0; }

/* inputs */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .legend { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="date"] {
  width: 100%; min-height: 46px; padding: 10px 12px; font-size: 16px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; color: var(--ink);
}
input[type="date"] { font-family: var(--font-body); }
.money { position: relative; }
.money span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.money input { padding-left: 42px; font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.btn { min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* analysis */
.section-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0 0 12px; }
.stack { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; }
.stack span { min-width: 3px; }
.cat-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.cat-list li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 3.2em; gap: 10px; align-items: center; }
.cat-list .name { overflow-wrap: anywhere; }
.cat-list .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
.cat-list .pct { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.divider { height: 1px; background: var(--line); margin-block: 18px; border: 0; }
.chart-wrap { max-width: 100%; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .bar { fill: var(--accent); opacity: 0.5; }
.chart .bar.now { opacity: 1; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* history */
.history-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.history-head .section-title { margin: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px; margin-block: 12px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day { margin-top: 16px; }
.day-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); padding-inline: 4px; margin-bottom: 6px; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.row .dot { margin-top: 5px; }
.row-title { font-weight: 500; overflow-wrap: anywhere; }
.row-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 13px; color: var(--muted); margin-top: 2px; }
.row-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { background: none; border: 0; padding: 6px 8px; margin-block: -6px; color: var(--accent); font-size: 13px; font-weight: 600; border-radius: 8px; }
.mini.bad { color: var(--bad); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 22px 16px; color: var(--muted); }
.empty strong { color: var(--ink); display: block; font-family: var(--font-display); font-size: 17px; margin-bottom: 4px; }

/* dock + sheet */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 24px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 45%); pointer-events: none; }
.dock .btn { display: block; width: 100%; max-width: 640px; margin-inline: auto; pointer-events: auto; font-size: 16px; min-height: 52px; box-shadow: 0 6px 20px rgba(19, 26, 38, 0.18); }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 640px; margin-inline: auto; max-height: 94%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 14px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cat-opt { position: relative; display: block; }
.cat-opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.cat-opt span { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.cat-opt input:checked + span { border-color: var(--accent); background: var(--surface); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.cat-opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.form-err { color: var(--bad); font-size: 13px; margin: 0; min-height: 1.2em; }
.actions { display: flex; gap: 8px; }
.actions .btn { flex: 1; }
.actions .btn.primary { flex: 2; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }

@media (max-width: 420px) {
  .total { font-size: 36px; }
  .stats { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1 class="brand">Kantong</h1>
    <div class="months" id="months"></div>
  </header>
  <section class="card" id="summary" aria-live="polite"></section>
  <section class="card" id="analysis"></section>
  <section id="history"></section>
</div>

<div class="dock"><button class="btn primary" type="button" data-act="open">+ Catat pengeluaran</button></div>

<div class="scrim" id="scrim" data-act="close" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <h2 id="sheetTitle">Catat pengeluaran</h2>
  <form class="form" id="expenseForm" autocomplete="off" novalidate>
    <div class="field">
      <label for="amount">Nominal</label>
      <div class="money"><span>Rp</span><input type="text" id="amount" inputmode="numeric" placeholder="0" data-money></div>
    </div>
    <div class="field">
      <div class="legend" id="catLegend">Kategori</div>
      <div class="cat-grid" id="catGrid" role="radiogroup" aria-labelledby="catLegend"></div>
    </div>
    <div class="field">
      <label for="date">Tanggal</label>
      <input type="date" id="date">
    </div>
    <div class="field">
      <label for="note">Catatan (opsional)</label>
      <input type="text" id="note" maxlength="80" placeholder="Contoh: nasi goreng, bensin, token listrik">
    </div>
    <p class="form-err" id="formErr" role="alert"></p>
    <div class="actions">
      <button class="btn" type="button" data-act="close">Batal</button>
      <button class="btn primary" type="submit" id="saveBtn">Simpan</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var KEY = 'kantong:v1';
  var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  var CATS = [
    { id: 'makan', name: 'Makan & minum' },
    { id: 'kos', name: 'Kos & tagihan' },
    { id: 'transport', name: 'Transport' },
    { id: 'kuliah', name: 'Kuliah' },
    { id: 'pulsa', name: 'Pulsa & internet' },
    { id: 'belanja', name: 'Belanja' },
    { id: 'hiburan', name: 'Hiburan' },
    { id: 'lainnya', name: 'Lainnya' }
  ];
  var CAT = {};
  CATS.forEach(function (c) { CAT[c.id] = c; });

  function $(s) { return document.querySelector(s); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function rp(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
  function compact(n) {
    if (n >= 1e6) return (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
    if (n >= 1e3) return (n / 1e3).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' rb';
    return String(Math.round(n));
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function digits(s) { return Number(String(s).replace(/\D/g, '')) || 0; }
  function niceMax(v) {
    if (v <= 0) return 100000;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  }
  function monthLabel(m) { var p = m.split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }

  var S = {
    expenses: [], budget: 0, month: todayStr().slice(0, 7), filter: 'all',
    editing: null, confirmDel: null, editBudget: false, lastCat: 'makan',
    mode: 'local', col: null, ready: false
  };

  /* ---------- penyimpanan ---------- */
  function localLoad() {
    try {
      var r = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (r) { S.expenses = r.expenses || []; S.budget = r.budget || 0; }
    } catch (e) { /* kosong */ }
  }
  function localSave() {
    try { localStorage.setItem(KEY, JSON.stringify({ expenses: S.expenses, budget: S.budget })); } catch (e) { /* abaikan */ }
  }

  async function putExpense(e) {
    if (S.mode === 'db') {
      try { await S.col.doc(e.id).set(e); } catch (err) { toast('Gagal menyimpan. Coba lagi.'); }
      return;
    }
    var i = S.expenses.findIndex(function (x) { return x.id === e.id; });
    if (i >= 0) S.expenses[i] = e; else S.expenses.push(e);
    localSave();
    render();
  }
  async function removeExpense(id) {
    if (S.mode === 'db') {
      try { await S.col.doc(id).delete(); } catch (err) { toast('Gagal menghapus. Coba lagi.'); }
      return;
    }
    S.expenses = S.expenses.filter(function (x) { return x.id !== id; });
    localSave();
    render();
  }
  async function putBudget(v) {
    S.budget = v;
    if (S.mode === 'db') {
      try { await S.col.doc('settings').set({ kind: 'settings', budget: v }); } catch (err) { toast('Gagal menyimpan anggaran.'); }
      render();
      return;
    }
    localSave();
    render();
  }

  /* ---------- hitung ---------- */
  function inMonth(m) { return S.expenses.filter(function (e) { return e.date && e.date.indexOf(m) === 0; }); }
  function sum(list) { return list.reduce(function (a, e) { return a + e.amount; }, 0); }
  function prevMonth(m) { var p = m.split('-').map(Number); var d = new Date(p[0], p[1] - 2, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function shiftMonth(delta) {
    var p = S.month.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1 + delta, 1);
    S.month = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    S.filter = 'all'; S.confirmDel = null; S.editBudget = false;
    render();
  }

  /* ---------- tampilan ---------- */
  function renderMonths() {
    var cur = todayStr().slice(0, 7);
    $('#months').innerHTML =
      '<button class="icon-btn" type="button" data-act="prev" aria-label="Bulan sebelumnya">‹</button>' +
      '<span class="label">' + monthLabel(S.month) + '</span>' +
      '<button class="icon-btn" type="button" data-act="next" aria-label="Bulan berikutnya"' + (S.month >= cur ? ' disabled' : '') + '>›</button>';
  }

  function ctx() {
    var p = S.month.split('-').map(Number);
    var dim = new Date(p[0], p[1], 0).getDate();
    var now = todayStr();
    var cm = now.slice(0, 7);
    var isCur = S.month === cm;
    var isPast = S.month < cm;
    var todayN = Number(now.slice(8));
    return { dim: dim, isCur: isCur, elapsed: isCur ? todayN : isPast ? dim : 0, todayN: todayN, now: now };
  }

  function renderSummary() {
    var items = inMonth(S.month);
    var total = sum(items);
    var c = ctx();
    var avg = c.elapsed ? total / c.elapsed : 0;
    var prevTotal = sum(inMonth(prevMonth(S.month)));
    var todayTotal = c.isCur ? sum(items.filter(function (e) { return e.date === c.now; })) : null;

    var stats =
      '<dl class="stats">' +
      '<div class="stat"><dt>' + (c.isCur ? 'Hari ini' : 'Transaksi') + '</dt><dd>' + (c.isCur ? rp(todayTotal) : items.length + ' catatan') + '</dd></div>' +
      '<div class="stat"><dt>Rata-rata/hari</dt><dd>' + rp(avg) + '</dd></div>' +
      '<div class="stat"><dt>Bulan lalu</dt><dd>' + (prevTotal ? rp(prevTotal) : '–') + '</dd></div>' +
      '</dl>';

    var budgetHtml;
    if (S.editBudget) {
      budgetHtml =
        '<form class="budget" id="budgetForm" autocomplete="off">' +
        '<div class="field"><label for="budgetInput">Anggaran per bulan</label>' +
        '<div class="money"><span>Rp</span><input type="text" id="budgetInput" inputmode="numeric" data-money placeholder="1.500.000" value="' + (S.budget ? S.budget.toLocaleString('id-ID') : '') + '"></div></div>' +
        '<div class="inline-form"><button class="btn primary" type="submit">Simpan anggaran</button>' +
        '<button class="btn" type="button" data-act="budgetcancel">Batal</button></div>' +
        '</form>';
    } else if (S.budget > 0) {
      var pct = Math.min(100, Math.round(total / S.budget * 100));
      var left = S.budget - total;
      var cls = total >= S.budget ? 'bad' : total >= S.budget * 0.8 ? 'warn' : '';
      var note;
      if (left < 0) note = '<p class="budget-note bad">Lewat ' + rp(-left) + ' dari anggaran.</p>';
      else if (c.isCur) {
        var daysLeft = c.dim - c.elapsed + 1;
        note = '<p class="budget-note">Sisa ' + rp(left) + '. Cukup untuk ' + rp(left / daysLeft) + ' per hari sampai akhir bulan.</p>';
      } else note = '<p class="budget-note">Sisa ' + rp(left) + '.</p>';
      budgetHtml =
        '<div class="budget"><div class="budget-head"><span>Anggaran <strong>' + rp(S.budget) + '</strong></span><span><strong>' + Math.round(total / S.budget * 100) + '%</strong> terpakai</span></div>' +
        '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span class="' + cls + '" style="width:' + pct + '%"></span></div>' +
        note +
        '<button class="link-btn" type="button" data-act="budget">Ubah anggaran</button></div>';
    } else {
      budgetHtml = '<div class="budget"><button class="link-btn" type="button" data-act="budget">Atur anggaran bulanan</button></div>';
    }

    $('#summary').innerHTML =
      '<p class="eyebrow">Pengeluaran ' + monthLabel(S.month) + '</p>' +
      '<p class="total"><span class="cur">Rp</span>' + Math.round(total).toLocaleString('id-ID') + '</p>' +
      stats + budgetHtml;
  }

  function chartSvg(items, c) {
    var days = [];
    for (var i = 0; i < c.dim; i++) days.push(0);
    items.forEach(function (e) {
      var d = Number(e.date.slice(8, 10));
      if (d >= 1 && d <= c.dim) days[d - 1] += e.amount;
    });
    var max = niceMax(Math.max.apply(null, days));
    var W = 400, H = 170, L = 42, R = 6, T = 10, B = 22;
    var iw = W - L - R, ih = H - T - B, step = iw / c.dim, bw = Math.max(2, step * 0.68);
    var g = '';
    [0, 0.5, 1].forEach(function (t) {
      var y = T + ih - ih * t;
      g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>' +
           '<text class="ax" x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + compact(max * t) + '</text>';
    });
    days.forEach(function (v, i) {
      var h = v / max * ih;
      var x = L + i * step + (step - bw) / 2;
      var now = c.isCur && i + 1 === c.todayN;
      g += '<rect class="bar' + (now ? ' now' : '') + '" x="' + x.toFixed(2) + '" y="' + (T + ih - h).toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + (v > 0 ? Math.max(h, 1.5) : 0).toFixed(2) + '" rx="1.5"><title>' + (i + 1) + ' ' + MONTHS[Number(S.month.slice(5)) - 1] + ': ' + rp(v) + '</title></rect>';
    });
    var marks = [1, 5, 10, 15, 20, 25, c.dim].filter(function (d, i, a) { return d <= c.dim && a.indexOf(d) === i; });
    marks.forEach(function (d) {
      var x = L + (d - 1) * step + step / 2;
      g += '<text class="ax" x="' + x.toFixed(2) + '" y="' + (H - 6) + '" text-anchor="middle">' + d + '</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Pengeluaran per hari, ' + monthLabel(S.month) + '">' + g + '</svg>';
  }

  function renderAnalysis() {
    var items = inMonth(S.month);
    var total = sum(items);
    if (!total) {
      $('#analysis').innerHTML = '<h2 class="section-title">Ke mana uangnya</h2><p class="hint" style="margin:0">Rincian per kategori dan grafik harian muncul setelah ada pengeluaran di ' + monthLabel(S.month) + '.</p>';
      return;
    }
    var by = {};
    items.forEach(function (e) { by[e.cat] = (by[e.cat] || 0) + e.amount; });
    var rows = Object.keys(by).map(function (k) { return { id: k, v: by[k] }; }).sort(function (a, b) { return b.v - a.v; });
    var stack = rows.map(function (r) { return '<span style="flex:' + r.v + ';background:var(--c-' + r.id + ')" title="' + esc((CAT[r.id] || CAT.lainnya).name) + '"></span>'; }).join('');
    var list = rows.map(function (r) {
      var cat = CAT[r.id] || CAT.lainnya;
      return '<li><span class="dot" style="background:var(--c-' + (CAT[r.id] ? r.id : 'lainnya') + ')"></span><span class="name">' + esc(cat.name) + '</span><span class="amt">' + rp(r.v) + '</span><span class="pct">' + Math.round(r.v / total * 100) + '%</span></li>';
    }).join('');
    $('#analysis').innerHTML =
      '<h2 class="section-title">Ke mana uangnya</h2>' +
      '<div class="stack" aria-hidden="true">' + stack + '</div>' +
      '<ul class="cat-list">' + list + '</ul>' +
      '<hr class="divider">' +
      '<h2 class="section-title">Per hari</h2>' +
      '<div class="chart-wrap">' + chartSvg(items, ctx()) + '</div>' +
      '<p class="hint">Tiap batang adalah total satu hari.' + (ctx().isCur ? ' Hari ini ditandai lebih pekat.' : '') + '</p>';
  }

  function dayLabel(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
  }

  function renderHistory() {
    var all = inMonth(S.month);
    var present = {};
    all.forEach(function (e) { present[e.cat] = true; });
    var filter = present[S.filter] ? S.filter : 'all';
    var items = all.filter(function (e) { return filter === 'all' || e.cat === filter; });
    items.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0); });

    var html = '<div class="history-head"><h2 class="section-title">Riwayat</h2><span class="hint" style="margin:0">' + items.length + ' catatan' + (S.expenses.length ? ' \u00b7 <button class="mini" type="button" data-act="export">Ekspor CSV</button>' : '') + '</span></div>';

    if (all.length) {
      html += '<div class="chips" role="group" aria-label="Filter kategori">' +
        '<button class="chip" type="button" data-act="filter" data-f="all" aria-pressed="' + (filter === 'all') + '">Semua</button>' +
        CATS.filter(function (c) { return present[c.id]; }).map(function (c) {
          return '<button class="chip" type="button" data-act="filter" data-f="' + c.id + '" aria-pressed="' + (filter === c.id) + '">' + esc(c.name) + '</button>';
        }).join('') + '</div>';
    }

    if (!S.ready) {
      html += '<div class="empty"><strong>Memuat catatan…</strong>Sebentar ya.</div>';
    } else if (!all.length) {
      html += '<div class="empty"><strong>Belum ada catatan di ' + monthLabel(S.month) + '</strong>Tekan Catat pengeluaran di bawah. Mulai dari yang kecil dulu, misalnya makan siang Rp 15.000 atau bayar kos.</div>';
    } else {
      var groups = [];
      items.forEach(function (e) {
        var last = groups[groups.length - 1];
        if (last && last.date === e.date) last.items.push(e); else groups.push({ date: e.date, items: [e] });
      });
      groups.forEach(function (g) {
        html += '<div class="day"><div class="day-head"><span>' + esc(dayLabel(g.date)) + '</span><span class="num">' + rp(sum(g.items)) + '</span></div><ul class="rows">';
        g.items.forEach(function (e) {
          var cat = CAT[e.cat] || CAT.lainnya;
          var del = S.confirmDel === e.id
            ? '<button class="mini bad" type="button" data-act="delyes" data-id="' + esc(e.id) + '">Yakin hapus?</button><button class="mini" type="button" data-act="delno">Batal</button>'
            : '<button class="mini" type="button" data-act="edit" data-id="' + esc(e.id) + '">Ubah</button><button class="mini bad" type="button" data-act="del" data-id="' + esc(e.id) + '">Hapus</button>';
          html += '<li class="row"><span class="dot" style="background:var(--c-' + (CAT[e.cat] ? e.cat : 'lainnya') + ')"></span>' +
            '<div><div class="row-title">' + esc(e.note || cat.name) + '</div><div class="row-sub"><span>' + esc(cat.name) + '</span>' + del + '</div></div>' +
            '<div class="row-amt">' + rp(e.amount) + '</div></li>';
        });
        html += '</ul></div>';
      });
    }
    $('#history').innerHTML = html;
  }

  function render() {
    renderMonths();
    renderSummary();
    renderAnalysis();
    renderHistory();
    if (S.editBudget) { var bi = $('#budgetInput'); if (bi && document.activeElement !== bi) bi.focus(); }
  }

  /* ---------- lembar isian ---------- */
  function buildCatGrid() {
    $('#catGrid').innerHTML = CATS.map(function (c) {
      return '<label class="cat-opt"><input type="radio" name="cat" value="' + c.id + '"><span><i class="dot" style="background:var(--c-' + c.id + ')"></i>' + esc(c.name) + '</span></label>';
    }).join('');
  }
  function setCat(id) {
    var el = document.querySelector('input[name="cat"][value="' + id + '"]');
    if (el) el.checked = true;
  }
  function openSheet(id) {
    S.editing = id || null;
    var e = id ? S.expenses.find(function (x) { return x.id === id; }) : null;
    $('#sheetTitle').textContent = e ? 'Ubah pengeluaran' : 'Catat pengeluaran';
    $('#amount').value = e ? e.amount.toLocaleString('id-ID') : '';
    setCat(e ? e.cat : S.lastCat);
    $('#date').value = e ? e.date : todayStr();
    $('#note').value = e ? (e.note || '') : '';
    $('#formErr').textContent = '';
    $('#scrim').hidden = false;
    $('#sheet').hidden = false;
    setTimeout(function () { $('#amount').focus(); }, 30);
  }
  function closeSheet() {
    $('#scrim').hidden = true;
    $('#sheet').hidden = true;
    S.editing = null;
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- event ---------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act, id = b.dataset.id;
    if (act === 'prev') shiftMonth(-1);
    else if (act === 'next') shiftMonth(1);
    else if (act === 'open') openSheet();
    else if (act === 'close') closeSheet();
    else if (act === 'edit') openSheet(id);
    else if (act === 'del') { S.confirmDel = id; renderHistory(); setTimeout(function () { if (S.confirmDel === id) { S.confirmDel = null; renderHistory(); } }, 5000); }
    else if (act === 'delno') { S.confirmDel = null; renderHistory(); }
    else if (act === 'delyes') { S.confirmDel = null; removeExpense(id); toast('Dihapus'); renderHistory(); }
    else if (act === 'filter') { S.filter = b.dataset.f; renderHistory(); }
    else if (act === 'budget') { S.editBudget = true; renderSummary(); var bi = $('#budgetInput'); if (bi) bi.focus(); }
    else if (act === 'budgetcancel') { S.editBudget = false; renderSummary(); }
    else if (act === 'export') exportCsv();
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.matches && el.matches('[data-money]')) {
      var n = digits(el.value);
      el.value = n ? n.toLocaleString('id-ID') : '';
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var form = ev.target;
    if (form.id === 'budgetForm') {
      S.editBudget = false;
      putBudget(digits($('#budgetInput').value));
      return;
    }
    if (form.id !== 'expenseForm') return;
    var amount = digits($('#amount').value);
    var catEl = document.querySelector('input[name="cat"]:checked');
    var date = $('#date').value;
    var err = $('#formErr');
    if (!amount) { err.textContent = 'Isi nominalnya dulu.'; $('#amount').focus(); return; }
    if (!catEl) { err.textContent = 'Pilih kategori.'; return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = 'Pilih tanggal.'; $('#date').focus(); return; }
    var old = S.editing ? S.expenses.find(function (x) { return x.id === S.editing; }) : null;
    var e = {
      kind: 'expense',
      id: old ? old.id : 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      amount: amount,
      cat: catEl.value,
      date: date,
      note: $('#note').value.trim(),
      createdAt: old && old.createdAt ? old.createdAt : Date.now()
    };
    S.lastCat = e.cat;
    S.month = date.slice(0, 7);
    closeSheet();
    putExpense(e);
    toast(old ? 'Perubahan tersimpan' : 'Tersimpan: ' + rp(amount));
    render();
  });

  function csvCell(v) {
    var t = String(v == null ? '' : v);
    return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }
  function exportCsv() {
    if (!S.expenses.length) { toast('Belum ada data untuk diekspor.'); return; }
    var list = S.expenses.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0); });
    var lines = ['Tanggal;Kategori;Nominal;Catatan'];
    list.forEach(function (e) {
      lines.push([e.date, (CAT[e.cat] || CAT.lainnya).name, e.amount, e.note || ''].map(csvCell).join(';'));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var name = 'kantong-' + todayStr() + '.csv';
    try {
      var file = new File([blob], name, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () { /* dibatalkan */ });
        return;
      }
    } catch (e) { /* lanjut ke unduhan biasa */ }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('CSV diunduh');
  }

  /* ---------- mulai ---------- */
  buildCatGrid();
  setCat(S.lastCat);
  render();
  localLoad();
  S.ready = true;
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* abaikan */ }
  var knownMonth = todayStr().slice(0, 7);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var cm = todayStr().slice(0, 7);
    if (cm !== knownMonth) {
      if (S.month === knownMonth) { S.month = cm; render(); }
      knownMonth = cm;
    }
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
